[workspace]
authors = ["Marios Nikolaidis <marionik23@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "PythonCentricPipelineForMetabolomics"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
lint = "ruff check"
test = "pytest -q"

[dependencies]
python = "==3.11"
pip = ">=26.2.1,<27"

[pypi-dependencies]
inmoose = ">=0.9.1, <0.10"
fpdf = ">=1.7.2, <2"
intervaltree = ">=3.2.1, <4"
jms-metabolite-services = ">=0.5.8"
khipu-metabolomics = ">=2.0.4, <3"
mass2chem = ">=0.4.9"
matchms = ">=0.27.0, <0.28"
matplotlib = ">=3.11.2, <4"
metdatamodel = ">=0.6.1"
numpy = ">=1.26.4, <2"
pandas = ">=3.0.5, <4"
pymzml = ">=2.6.1, <3"
scikit-learn = ">=1.9.1, <2"
scipy = ">=1.16, <2"
seaborn = ">=0.13.2, <0.14"
setuptools = ">=84.0.0, <85"
asari-metabolomics = ">=1.18.5, <2"
gdown = ">=6.2.0, <7"
isocor = ">=2.2.4, <3"
pytest = ">=8.3, <9"
ruff = ">=0.13, <1"
